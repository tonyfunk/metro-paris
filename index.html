<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prochains métros · Paris</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0d1b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Métro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#14213d;--mute:#6b7690;--line:#d8dde6;--board:#0d1b3d;--amber:#ffb703}
@media (prefers-color-scheme:dark){:root{--bg:#0a1226;--card:#121d3a;--ink:#eef1f8;--mute:#8d9ab8;--line:#24325a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Helvetica Neue",Arial,sans-serif;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 32px)}
main{max-width:480px;margin:0 auto}
h1{font-size:1.25rem;margin:24px 0 16px}
.lines{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.lines button{aspect-ratio:1;border:3px solid transparent;border-radius:50%;font:700 1rem/1 inherit;color:#fff;cursor:pointer;padding:0}
.lines button[aria-pressed=true]{border-color:var(--ink);transform:scale(1.08)}
.lines button:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
select{width:100%;padding:14px;font-size:1rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.board{margin-top:20px;background:var(--board);color:#fff;border-radius:14px;overflow:hidden}
.dir{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px;border-top:1px solid #ffffff22}
.dir:first-child{border-top:0}
.dir b{font-size:1.05rem;font-weight:600}
.dir small{display:block;color:#9fb0d6;font-size:.8rem;font-weight:400}
.t{display:flex;gap:16px;text-align:right}
.t span{font:700 1.9rem/1 inherit;color:var(--amber);min-width:3.2ch}
.t span i{font-size:.8rem;font-style:normal;margin-left:2px}
.t span.sch{color:#c9d3ee}
.msg{padding:20px;color:var(--mute)}
.foot{margin-top:12px;color:var(--mute);font-size:.8rem}
.alerts{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.alerts .ok{padding:12px 14px;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
.alerts .ok::before{content:"";width:10px;height:10px;border-radius:50%;background:#2a9d4b}
.alerts details{border-top:1px solid var(--line)}
.alerts details:first-child{border-top:0}
.alerts summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
.alerts summary::-webkit-details-marker{display:none}
.alerts summary::after{content:"▾";margin-left:auto;color:var(--mute)}
.alerts details[open] summary::after{content:"▴"}
.alerts summary .tt{flex:1;min-width:0;font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:.85rem;line-height:28px;text-align:center}
.lvl{flex:none;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.lvl.sev{background:#e63946}
.alerts .it{padding:0 14px 12px 52px;font-size:.85rem}
.alerts .it b{display:block;margin-bottom:2px}
.alerts .it p{margin:0;color:var(--mute);white-space:pre-line}
.lines button{position:relative}
.lines button[data-alert]::after{content:"";position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid var(--bg)}
.lines button[data-alert=sev]::after{background:#e63946}
</style>
</head>
<body>
<main>
  <section class="alerts" id="alerts" aria-label="Info trafic" aria-live="polite"><div class="ok">Chargement de l'info trafic…</div></section>
  <h1>Prochains métros</h1>
  <div class="lines" id="lines" role="group" aria-label="Ligne"></div>
  <select id="stations" aria-label="Station" disabled><option>Choisis d'abord une ligne</option></select>
  <div class="board" id="board" hidden aria-live="polite"></div>
  <p class="foot" id="foot"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };
let line = null, stop = null, timer = null;

const api = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(r.status); return r.json(); };

async function init() {
  try {
    const lines = await api("/api/lines");
    $("lines").innerHTML = "";
    for (const l of lines) {
      const b = document.createElement("button");
      b.textContent = l.code; b.style.background = l.color; b.dataset.id = l.id;
      b.setAttribute("aria-label", "Ligne " + l.code); b.setAttribute("aria-pressed", "false");
      b.onclick = () => pickLine(l.id);
      $("lines").append(b);
    }
    const last = store.get("line"); if (last) await pickLine(last, store.get("stop"));
  } catch { $("foot").textContent = "Impossible de charger les lignes. Vérifie ta clé PRIM et relance le serveur."; }
}

async function pickLine(id, restoreStop) {
  line = id; store.set("line", id);
  document.querySelectorAll("#lines button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === id));
  $("board").hidden = true; clearInterval(timer);
  const sel = $("stations"); sel.disabled = true; sel.innerHTML = "<option>Chargement…</option>";
  try {
    const st = await api("/api/stations?line=" + encodeURIComponent(id));
    sel.innerHTML = '<option value="">Choisis ta station</option>' + st.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
    sel.disabled = false;
    if (restoreStop && st.some(s => s.id === restoreStop)) { sel.value = restoreStop; pickStop(restoreStop); }
  } catch { sel.innerHTML = "<option>Erreur de chargement</option>"; }
}

async function refresh() {
  if (!line || !stop) return;
  const b = $("board");
  try {
    const d = await api(`/api/next?line=${encodeURIComponent(line)}&stop=${encodeURIComponent(stop)}`);
    b.innerHTML = d.length ? d.map(x => `
      <div class="dir"><b><small>Direction</small>${x.direction}</b>
      <div class="t">${x.times.map(t => `<span class="${t.realtime ? "" : "sch"}">${t.mins === 0 ? "À quai" : t.mins}${t.mins ? "<i>min</i>" : ""}</span>`).join("")}</div></div>`).join("")
      : '<div class="msg">Aucun passage prévu pour le moment.</div>';
    $("foot").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}) + " · en clair = horaire théorique";
  } catch { b.innerHTML = '<div class="msg">Données indisponibles. Nouvel essai dans 30 s.</div>'; }
  b.hidden = false;
}

function pickStop(id) {
  stop = id; store.set("stop", id); clearInterval(timer);
  if (!id) { $("board").hidden = true; return; }
  refresh(); timer = setInterval(refresh, 30000);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let alertsByLine = {};

function markLines() {
  document.querySelectorAll("#lines button").forEach(b => {
    const a = alertsByLine[b.dataset.id];
    if (a) b.dataset.alert = a.items.some(i => i.severe) ? "sev" : "info"; else delete b.dataset.alert;
  });
}

async function loadAlerts() {
  const el = $("alerts");
  try {
    const d = await api("/api/disruptions");
    alertsByLine = Object.fromEntries(d.map(l => [l.id, l]));
    el.innerHTML = d.length ? d.map(l => `
      <details><summary><span class="badge" style="background:${esc(l.color)}">${esc(l.code)}</span>
        <i class="lvl${l.items.some(i => i.severe) ? " sev" : ""}"></i><span class="tt">${esc(l.items[0].title)}${l.items.length > 1 ? ` (+${l.items.length - 1})` : ""}</span></summary>
        ${l.items.map(i => `<div class="it"><b>${esc(i.title)}</b>${i.text ? `<p>${esc(i.text)}</p>` : ""}</div>`).join("")}
      </details>`).join("")
      : '<div class="ok">Trafic normal sur toutes les lignes</div>';
  } catch { el.innerHTML = '<div class="ok">Info trafic indisponible</div>'; }
  markLines();
}

$("stations").onchange = e => pickStop(e.target.value);
init().then(markLines);
loadAlerts(); setInterval(loadAlerts, 120000);
</script>
</body>
</html>
